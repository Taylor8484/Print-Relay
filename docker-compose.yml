services:
  printrelay:
    # Option 1: Build locally from source (default)
    build: .

    # Option 2: Use pre-built image from GitHub Container Registry
    # Uncomment the line below and comment out 'build: .' to use pre-built images
    # image: ghcr.io/taylor8484/print-relay:latest

    container_name: printrelay
    network_mode: host
    volumes:
      # Mount CUPS socket for printer access
      - /var/run/cups:/var/run/cups
      # Persist printer configuration across container updates
      - ./printer-config:/app/printer-config
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
